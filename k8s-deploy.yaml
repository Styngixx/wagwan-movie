apiVersion: apps/v1
kind: Deployment
metadata:
  name: wagwan-movie-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wagwan-movie
  template:
    metadata:
      labels:
        app: wagwan-movie
    spec:
      containers:
        - name: wagwan-movie-container
          image: wagwan-movie:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3600
          env:
            - name: PORT
              value: "3600"
            - name: SUPABASE_URL
              value: "https://hcjrttwlorwknxagfkwr.supabase.co"
            - name: SUPABASE_KEY
              value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjanJ0dHdsb3J3a254YWdma3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MTk5MTUsImV4cCI6MjEwNDQ5NTkxNX0.tnlLtNJLBSQ_bq0sbnMITN82MZnt0b6mDd2kxezH1C0"
---
apiVersion: v1
kind: Service
metadata:
  name: wagwan-movie-service
spec:
  type: NodePort
  selector:
    app: wagwan-movie
  ports:
    - protocol: TCP
      port: 3600
      targetPort: 3600
      nodePort: 30080