name: CI - David

on:
  push:
    branches: [ "david-rama", "main" ]
  pull_request:
    branches: [ "david-rama", "main" ]

jobs:
  verificacion:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Instalar dependencias
      run: npm install