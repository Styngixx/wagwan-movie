apiVersion: apps/v1
kind: Deployment
metadata:
  name: wagwan-backend
  labels:
    app: wagwan-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wagwan-backend
  template:
    metadata:
      labels:
        app: wagwan-backend
    spec:
      containers:
        - name: backend
          image: wagwan-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3600
          env:
            - name: PORT
              value: "3600"
            - name: SUPABASE_URL
              value: "PEGA_AQUI_TU_SUPABASE_URL"
            - name: SUPABASE_KEY
              value: "PEGA_AQUI_TU_SUPABASE_KEY"
---
apiVersion: v1
kind: Service
metadata:
  name: wagwan-backend-service
spec:
  type: NodePort
  selector:
    app: wagwan-backend
  ports:
    - protocol: TCP
      port: 3600
      targetPort: 3600
      nodePort: 30600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wagwan-frontend
  labels:
    app: wagwan-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wagwan-frontend
  template:
    metadata:
      labels:
        app: wagwan-frontend
    spec:
      containers:
        - name: frontend
          image: wagwan-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wagwan-frontend-service
spec:
  type: NodePort
  selector:
    app: wagwan-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080