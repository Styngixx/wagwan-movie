<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAGWAN - Plataforma de Cursos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/index.css">
</head>
<body> 
    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="logo">
            <span class="play-icon">▶</span> WAGWAN
        </div>
        
        <!-- Menú Minimalista -->
        <nav class="nav-links">
            <a href="/" class="active">Inicio</a>
            <a href="#movies-container">Cursos</a>
            <a href="#series">Rutas de Aprendizaje</a>
            <a href="/public/pages/favoritos.html">Mis Clases Guardadas</a>
        </nav>

        <div class="user-actions">
            <!-- Buscador estilo píldora -->
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar curso...">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <!-- Dropdown de resultados -->
                <div class="search-dropdown-results" id="searchResults"></div>
            </div>

            <!-- Botones de Autenticación Exactos a tu imagen -->
            <button class="btn-text-login" id="btnEntrar">Entrar</button>
            <button class="btn-blue-register" id="btnRegistro">Registro</button>
            <div class="theme-toggle" id="themeToggle" title="Cambiar Tema">🌙</div>
        </div>
    </header>

    <!-- MODAL DE AUTENTICACIÓN -->
    <div class="admin-modal" id="authModal">
        <div class="admin-modal-content" style="max-width: 380px;">
            <button class="admin-modal-close" id="authModalClose">&times;</button>
            <div class="admin-modal-logo">
                <span class="play-icon">▶</span><span>WAGWAN</span>
            </div>
            <h2 id="authTitle">Iniciar Sesión</h2>
            <p class="admin-modal-description" id="authDesc">Ingresa a tu cuenta para ver tu contenido.</p>
            
            <form id="authForm">
                <div class="admin-form-group">
                    <label>Usuario</label>
                    <input type="text" id="authUsuario" placeholder="Tu nombre de usuario" required>
                </div>
                <div class="admin-form-group">
                    <label>Contraseña</label>
                    <input type="password" id="authPassword" placeholder="Tu contraseña secreta" required>
                </div>
                <p class="admin-login-error" id="authError"></p>
                <button type="submit" class="admin-login-button" id="authSubmitBtn">Entrar</button>
            </form>
        </div>
    </div>

    <!-- HERO BANNER (Carrusel Automático) -->
    <section class="hero-banner" id="heroBannerContainer" style="transition: background-image 0.8s ease-in-out;">
        <!-- Se inyectará desde JavaScript -->
    </section>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="layout-container">
        
        <main class="main-content">
            <!-- CATÁLOGO DE CURSOS (Sin Promos) -->
            <section class="section-block">
                <h2>Cursos destacados</h2>
                <div class="movie-filters">
                    <button class="movie-filter active" data-category="Todas">Todos</button>
                    <button class="movie-filter" data-category="Programación">Programación</button>
                    <button class="movie-filter" data-category="Algoritmos">Algoritmos</button>
                    <button class="movie-filter" data-category="Bases de Datos">Bases de Datos</button>
                    <button class="movie-filter" data-category="Redes">Redes de Comunicación</button>
                </div>
                <div class="grid-episodios" id="movies-container">
                    <!-- Tarjetas inyectadas por JS -->
                </div>
            </section>
        </main>

        <!-- SIDEBAR: TOP ESTRENOS -->
        <aside class="sidebar">
            <div class="sidebar-header">TOP CURSOS</div>
            <div class="top-list" id="topEstrenosContainer">
                <!-- Top inyectado por JS -->
            </div>
        </aside>

    </div>

   <footer class="footer">
       <!-- Tu footer aquí -->
   </footer>
   
   <script src="/public/js/index.js"></script>
</body>
</html>
